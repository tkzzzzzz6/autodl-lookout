# 发版：推送 v* tag（如 v0.1.0）后打包 Windows / macOS / Linux 安装包，全部成功后一次性创建并发布 Release（设为 Latest）。
# 打包过程中不碰 Release：各平台的安装包先作为这次运行的 artifact 存着，有一个平台失败就什么都不发布；
# 偶发问题修好后在这次运行里点「Re-run failed jobs」，已经成功的平台不用重打。
# 步骤见 README 的「发版」。
name: 发版

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 tag（如 v0.1.0），必须已经推送到 GitHub"
        required: true
      dry_run:
        description: "只打包、核对，不发布（试新的发版流程用，安装包在这次运行的 Artifacts 里）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: 检查版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tag 和三处版本号一致
        run: node scripts/version.mjs check "$TAG"
      - name: 这个版本还没发布过
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 草稿用 tag 查不到，所以翻列表
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" |
          while read -r id draft; do
            if [ "$draft" = "true" ]; then
              echo "删掉旧流程留下的草稿 $id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::$TAG 已经发布过了，不覆盖已发布的安装包。要重新发就换一个版本号。"
              exit 1
            fi
          done

  build:
    name: 打包（${{ matrix.name }}）
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            key: windows-x64
            os: windows-latest
            args: ""
            targets: ""
          - name: macOS Apple 芯片
            key: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            targets: aarch64-apple-darwin
          - name: macOS Intel
            key: macos-x64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            targets: x86_64-apple-darwin
          # 用较老的 Ubuntu 构建，glibc 版本低，能在更多发行版上运行
          - name: Linux x64
            key: linux-x64
            os: ubuntu-22.04
            args: "--verbose"
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Linux 打包需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2：打 AppImage 用的 linuxdeploy 本身是 AppImage，要 FUSE 才能运行
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.key }}
      - run: npm ci
      - name: 清掉缓存里可能残留的旧版本安装包
        shell: bash
        run: rm -rf src-tauri/target/release/bundle src-tauri/target/*/release/bundle
      # appimagetool 打包时自己去 GitHub 下载 AppImage runtime，失败一次（504）就整个失败、没有重试。
      # 先用带重试的 curl 下好，通过 LDAI_RUNTIME_FILE 交给 linuxdeploy 的 appimage 插件
      - name: 下载 AppImage runtime
        if: runner.os == 'Linux'
        run: |
          f="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 5 -o "$f" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "LDAI_RUNTIME_FILE=$f" >> "$GITHUB_ENV"
      - name: 打包
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # 没有 FUSE 时让 linuxdeploy 解压后运行（只对 Linux 有用）
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: 存下安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.key }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # 所有平台都成功才会跑到这里（needs 里有失败就跳过），一次性创建并发布
  publish:
    name: 发布 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: 整理文件名、核对安装包齐全
        run: |
          mkdir -p out
          # 文件名里的空格换成点（GitHub 上传时也会这么换），说明里的文件名才对得上
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            b=$(basename "$f"); mv "$f" "out/${b// /.}"
          done
          ls -la out
          for p in '_x64-setup\.exe' '_x64_en-US\.msi' '_aarch64\.dmg' '_x64\.dmg' '_amd64\.deb' '\.x86_64\.rpm' '_amd64\.AppImage'; do
            ls out | grep -qE -- "${p}\$" || { echo "::error::安装包不全，缺 *${p//\\/}，不发布"; exit 1; }
          done
      - name: 发布
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## 下载

          | 系统 | 文件 |
          |---|---|
          | Windows 10 / 11（推荐） | `AutoDL.Lookout_*_x64-setup.exe` |
          | Windows（批量部署） | `AutoDL.Lookout_*_x64_en-US.msi` |
          | macOS（Apple 芯片 M1–M4） | `AutoDL.Lookout_*_aarch64.dmg` |
          | macOS（Intel） | `AutoDL.Lookout_*_x64.dmg` |
          | Linux：Debian / Ubuntu | `AutoDL.Lookout_*_amd64.deb` |
          | Linux：Fedora / openSUSE | `AutoDL.Lookout-*.x86_64.rpm` |
          | Linux：其他发行版（免安装） | `AutoDL.Lookout_*_amd64.AppImage`（下载后 `chmod +x` 再运行） |

          安装包没有代码签名：
          - Windows 第一次运行如果弹出「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」
          - macOS 提示「无法打开」时，在「系统设置 → 隐私与安全性」里点「仍要打开」

          Linux 需要桌面环境有系统托盘（GNOME 要装 AppIndicator 扩展）和钥匙串服务（gnome-keyring 或 KWallet），没有钥匙串时服务器密码存不了。

          MD
          gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "显卡管家 $TAG" --notes-file notes.md --generate-notes
